# Capteur camera pour geometrie automobile - ESP32-S3 + OV5640
# YAML = materiel / ESPHome
# C++  = acquisition JPEG / decodage gris / detection / calculs

substitutions:
  device_name: geometrie-camera
  friendly_name: Geometrie Camera
  # Format du framebuffer configure au demarrage du driver camera.
  # Valeurs testees/prevues : JPEG ou GRAYSCALE.
  # Le changement necessite une recompilation/reflash ; ne pas le modifier
  # dynamiquement car esp32-camera dimensionne ses buffers DMA au demarrage.
  camera_pixel_format: JPEG

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}

esp32:
  variant: esp32s3
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

preferences:
  flash_write_interval: 5s

logger:
  # Au repos : uniquement warnings/erreurs. Les publications periodiques des
  # entites ESPHome restent disponibles via API/web mais sont totalement
  # retirees du journal.
  level: INFO
  logs:
    # ESPHome interdit qu'un tag INFO soit plus verbeux qu'un global WARN.
    # On garde donc INFO globalement, puis on coupe explicitement tout ce qui
    # n'est pas utile au diagnostic de travail.
    sensor: NONE
    text_sensor: NONE
    number: NONE
    button: NONE
    app: WARN
    api: WARN
    wifi: WARN
    mdns: WARN
    web_server: WARN
    captive_portal: WARN
    ota: WARN
    i2c: WARN
    preferences: WARN
    esp32_camera: WARN

    # Details internes tres verbeux : silencieux sauf anomalie.
    jpeg_diag: WARN
    target_candidate_finder: WARN
    target_corner_refiner: WARN
    target_subpixel_refiner: WARN
    target_code_decoder: WARN
    target_detector: WARN

    # Journal de travail : visible uniquement quand une operation est
    # reellement en cours (mesure continue, calibration, zoom/recentrage).
    continuous_measurement: INFO
    full_calibration: INFO
    target_tracking: INFO
    camera_viewport: INFO
    camera_settings: INFO

api:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: NONE
  fast_connect: true
  ap:
    ssid: "Geometrie Camera Fallback"
    password: "geometrie"

captive_portal:

web_server:
  port: 80
  version: 3

ota:
  - platform: esphome
  - platform: web_server

external_components:
  - source: geometrie-camera/components

geometrie_camera_app:
  id: geometrie_camera_app_id
  camera_id: camera_geometrie

i2c:
  - id: camera_i2c
    sda: GPIO4
    scl: GPIO5
    scan: true

esp32_camera:
  id: camera_geometrie
  name: "Camera geometrie OV5640"
  internal: true
  external_clock:
    pin: GPIO15
    frequency: 8MHz
  i2c_id: camera_i2c
  data_pins:
    - GPIO11
    - GPIO9
    - GPIO8
    - GPIO10
    - GPIO12
    - GPIO18
    - GPIO17
    - GPIO16
  vsync_pin: GPIO6
  href_pin: GPIO7
  pixel_clock_pin: GPIO13
  pixel_format: ${camera_pixel_format}
  resolution: 800x600
  jpeg_quality: 10
  # Reglage nominal du projet : JPEG en niveaux de gris. On garde JPEG pour
  # les performances/memoire et on applique l'effet monochrome du capteur.
  special_effect: GRAYSCALE
  # ESPHome utilise true par defaut pour ces deux options. On les fixe
  # explicitement car le calcul des ROI convertit le repere image affiche
  # vers le repere physique OV5640 en tenant compte de cette orientation.
  vertical_flip: true
  horizontal_mirror: true
  frame_buffer_count: 1
  frame_buffer_location: PSRAM
  max_framerate: 10 fps
  idle_framerate: 0 fps
  test_pattern: false

# Resolution de travail fixe pour le pipeline operationnel.
# Les reglages optiques ne sont plus exposes manuellement : la calibration
# automatique pilote en interne les parametres necessaires de l'OV5640.

button:
  - platform: template
    name: "05 Demarrer mesures continues"
    on_press:
      - lambda: |-
          id(geometrie_camera_app_id).start_continuous_measurement();

  - platform: template
    name: "06 Arreter mesures continues"
    on_press:
      - lambda: |-
          id(geometrie_camera_app_id).stop_continuous_measurement();

number:
  - platform: template
    name: "07 Intervalle acquisition"
    id: intervalle_acquisition_ms
    min_value: 200
    max_value: 10000
    step: 100
    initial_value: 1000
    restore_value: false
    optimistic: true
    unit_of_measurement: "ms"
    set_action:
      - lambda: |-
          id(geometrie_camera_app_id).set_continuous_interval_ms(static_cast<uint32_t>(x));


# Les anciennes entites text_sensor/sensor de diagnostic republiaient leur
# etat toutes les 1 a 5 secondes. La commande `esphome logs` affiche ces
# publications sous la forme [S][sensor]/[S][text_sensor], independamment du
# filtrage du logger. Elles sont desormais supprimees : la supervision PC lit
# les memes informations, plus detaillees, via les API HTTP /continuous,
# /measurement et /target.
#
# On conserve les boutons et le nombre ci-dessus comme commandes ESPHome
# manuelles de secours. Les logs de travail utiles sont emis directement par
# les composants C++.
