# Capteur camera pour geometrie automobile - ESP32-S3 + OV5640
# YAML = materiel / ESPHome
# C++  = acquisition JPEG / correction / detection / calculs

substitutions:
  device_name: geometrie-camera
  friendly_name: Geometrie Camera
  # Format du framebuffer configure au demarrage du driver camera.
  # Valeurs testees/prevues : JPEG ou GRAYSCALE.
  # Le changement necessite une recompilation/reflash ; ne pas le modifier
  # dynamiquement car esp32-camera dimensionne ses buffers DMA au demarrage.
  camera_pixel_format: JPEG

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}

esp32:
  variant: esp32s3
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

preferences:
  flash_write_interval: 5s

logger:
  level: DEBUG
  logs:
    target_candidate_finder: INFO
    target_corner_refiner: INFO
    target_code_decoder: INFO
    target_detector: INFO
    image_sharpness: INFO

api:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: NONE
  fast_connect: true
  ap:
    ssid: "Geometrie Camera Fallback"
    password: "geometrie"

captive_portal:

web_server:
  port: 80
  version: 3

ota:
  - platform: esphome
  - platform: web_server

external_components:
  - source: geometrie-camera/components

geometrie_camera_app:
  id: geometrie_camera_app_id
  camera_id: camera_geometrie

i2c:
  - id: camera_i2c
    sda: GPIO4
    scl: GPIO5
    scan: true

esp32_camera:
  id: camera_geometrie
  name: "Camera geometrie OV5640"
  internal: true
  external_clock:
    pin: GPIO15
    frequency: 8MHz
  i2c_id: camera_i2c
  data_pins:
    - GPIO11
    - GPIO9
    - GPIO8
    - GPIO10
    - GPIO12
    - GPIO18
    - GPIO17
    - GPIO16
  vsync_pin: GPIO6
  href_pin: GPIO7
  pixel_clock_pin: GPIO13
  pixel_format: ${camera_pixel_format}
  resolution: 2560x1920
  jpeg_quality: 10
  # ESPHome utilise true par defaut pour ces deux options. On les fixe
  # explicitement car le calcul des ROI convertit le repere image affiche
  # vers le repere physique OV5640 en tenant compte de cette orientation.
  vertical_flip: true
  horizontal_mirror: true
  frame_buffer_count: 1
  frame_buffer_location: PSRAM
  max_framerate: 5 fps
  idle_framerate: 0 fps
  test_pattern: false

# Resolution de travail :
# GET /api/camera/settings
# GET /api/camera/settings/set?resolution=800x600
# Le champ pixel_format de /api/camera/settings indique le format actif.
# Pour tester GRAYSCALE, passer camera_pixel_format a GRAYSCALE puis reflasher.

button:
  - platform: template
    name: "05 Demarrer mesures continues"
    on_press:
      - lambda: |-
          id(geometrie_camera_app_id).start_continuous_measurement();

  - platform: template
    name: "06 Arreter mesures continues"
    on_press:
      - lambda: |-
          id(geometrie_camera_app_id).stop_continuous_measurement();

number:
  - platform: template
    name: "07 Intervalle acquisition"
    id: intervalle_acquisition_ms
    min_value: 200
    max_value: 10000
    step: 100
    initial_value: 1000
    restore_value: false
    optimistic: true
    unit_of_measurement: "ms"
    set_action:
      - lambda: |-
          id(geometrie_camera_app_id).set_continuous_interval_ms(static_cast<uint32_t>(x));

text_sensor:
  - platform: template
    name: "01 Etat acquisition"
    id: etat_capteur_geometrie
    update_interval: 1s
    lambda: |-
      return {id(geometrie_camera_app_id).status_text()};

  - platform: template
    name: "02 Resolution travail"
    update_interval: 2s
    lambda: |-
      return {id(geometrie_camera_app_id).active_resolution_text()};

  - platform: template
    name: "03 Cible actuelle"
    update_interval: 1s
    lambda: |-
      const auto &service = id(geometrie_camera_app_id).target_detection_service();
      if (!service.ready()) return {"inconnue"};
      return {service.target_found() ? "trouvee" : "absente"};

  - platform: template
    name: "04 Pose derniere mesure valide"
    update_interval: 1s
    lambda: |-
      const auto &m = id(geometrie_camera_app_id).last_measurement();
      if (!m.valid) return {"indisponible"};
      return {m.pose_valid ? "valide" : "rejetee"};

sensor:
  # Les valeurs principales restent celles de la derniere mesure valide.
  # Un cycle sans cible ne les efface pas ; "03 Cible actuelle" indique
  # explicitement si la cible a ete trouvee sur l'image courante.
  - platform: template
    name: "10 Distance cible"
    unit_of_measurement: "mm"
    accuracy_decimals: 1
    update_interval: 1s
    lambda: |-
      const auto &m = id(geometrie_camera_app_id).last_measurement();
      return m.valid ? m.distance_mm : NAN;

  - platform: template
    name: "11 Profondeur Z"
    unit_of_measurement: "mm"
    accuracy_decimals: 1
    update_interval: 1s
    lambda: |-
      const auto &m = id(geometrie_camera_app_id).last_measurement();
      return m.valid ? m.z_mm : NAN;

  - platform: template
    name: "12 Position X"
    unit_of_measurement: "mm"
    accuracy_decimals: 1
    update_interval: 1s
    lambda: |-
      const auto &m = id(geometrie_camera_app_id).last_measurement();
      return m.valid ? m.x_mm : NAN;

  - platform: template
    name: "13 Position Y"
    unit_of_measurement: "mm"
    accuracy_decimals: 1
    update_interval: 1s
    lambda: |-
      const auto &m = id(geometrie_camera_app_id).last_measurement();
      return m.valid ? m.y_mm : NAN;

  - platform: template
    name: "14 Angle visee horizontal"
    unit_of_measurement: "deg"
    accuracy_decimals: 4
    update_interval: 1s
    lambda: |-
      const auto &m = id(geometrie_camera_app_id).last_measurement();
      return m.valid ? m.bearing_yaw_deg : NAN;

  - platform: template
    name: "15 Angle visee vertical"
    unit_of_measurement: "deg"
    accuracy_decimals: 4
    update_interval: 1s
    lambda: |-
      const auto &m = id(geometrie_camera_app_id).last_measurement();
      return m.valid ? m.bearing_pitch_deg : NAN;

  - platform: template
    name: "16 Qualite derniere mesure valide"
    accuracy_decimals: 3
    update_interval: 1s
    lambda: |-
      const auto &m = id(geometrie_camera_app_id).last_measurement();
      return m.valid ? m.quality : NAN;

  - platform: template
    name: "17 Temps dernier cycle"
    unit_of_measurement: "ms"
    accuracy_decimals: 0
    update_interval: 1s
    lambda: |-
      return id(geometrie_camera_app_id).continuous_last_cycle_ms();

  - platform: template
    name: "18 Cycles continus"
    accuracy_decimals: 0
    update_interval: 1s
    lambda: |-
      return id(geometrie_camera_app_id).continuous_cycle_count();

  - platform: template
    name: "19 Mesures valides session"
    accuracy_decimals: 0
    update_interval: 1s
    lambda: |-
      return id(geometrie_camera_app_id).continuous_measurement_controller().valid_measurement_count();

  - platform: template
    name: "20 Mesures valides total"
    accuracy_decimals: 0
    update_interval: 2s
    lambda: |-
      return id(geometrie_camera_app_id).valid_measurement_count();

  # Timings du dernier cycle : permettent de cibler les optimisations futures.
  - platform: template
    name: "21 Temps capture"
    unit_of_measurement: "ms"
    accuracy_decimals: 0
    update_interval: 1s
    lambda: |-
      return id(geometrie_camera_app_id).continuous_measurement_controller().last_capture_ms();

  - platform: template
    name: "22 Temps controle nettete"
    unit_of_measurement: "ms"
    accuracy_decimals: 0
    update_interval: 1s
    lambda: |-
      return id(geometrie_camera_app_id).continuous_measurement_controller().last_sharpness_ms();

  - platform: template
    name: "23 Temps filtre"
    unit_of_measurement: "ms"
    accuracy_decimals: 0
    update_interval: 1s
    lambda: |-
      return id(geometrie_camera_app_id).continuous_measurement_controller().last_filter_ms();

  - platform: template
    name: "24 Temps detection cible"
    unit_of_measurement: "ms"
    accuracy_decimals: 0
    update_interval: 1s
    lambda: |-
      return id(geometrie_camera_app_id).continuous_measurement_controller().last_detect_ms();

  - platform: template
    name: "25 Temps calcul geometrie"
    unit_of_measurement: "ms"
    accuracy_decimals: 0
    update_interval: 1s
    lambda: |-
      return id(geometrie_camera_app_id).continuous_measurement_controller().last_compute_ms();

  - platform: template
    name: "26 Score nettete x100"
    accuracy_decimals: 0
    update_interval: 1s
    lambda: |-
      return id(geometrie_camera_app_id).continuous_measurement_controller().last_sharpness_score_x100();

  - platform: template
    name: "27 Reference nettete x100"
    accuracy_decimals: 0
    update_interval: 1s
    lambda: |-
      return id(geometrie_camera_app_id).continuous_measurement_controller().sharpness_reference_score_x100();

  - platform: template
    name: "28 Recaptures flou dernier cycle"
    accuracy_decimals: 0
    update_interval: 1s
    lambda: |-
      return id(geometrie_camera_app_id).continuous_measurement_controller().last_capture_retry_count();

  - platform: template
    name: "29 Recaptures flou session"
    accuracy_decimals: 0
    update_interval: 1s
    lambda: |-
      return id(geometrie_camera_app_id).continuous_measurement_controller().blur_retry_count();

  - platform: template
    name: "90 Focale calibration X"
    unit_of_measurement: "px"
    accuracy_decimals: 2
    update_interval: 5s
    lambda: |-
      const auto &c = id(geometrie_camera_app_id).measurement_engine().calibration();
      return c.fx_px > 0.0f ? c.fx_px : NAN;

  - platform: template
    name: "91 Focale calibration Y"
    unit_of_measurement: "px"
    accuracy_decimals: 2
    update_interval: 5s
    lambda: |-
      const auto &c = id(geometrie_camera_app_id).measurement_engine().calibration();
      return c.fy_px > 0.0f ? c.fy_px : NAN;

  - platform: template
    name: "92 Centre optique X"
    unit_of_measurement: "px"
    accuracy_decimals: 2
    update_interval: 5s
    lambda: |-
      const auto &c = id(geometrie_camera_app_id).measurement_engine().calibration();
      return c.reference_width_px > 0 ? c.cx_px : NAN;

  - platform: template
    name: "93 Centre optique Y"
    unit_of_measurement: "px"
    accuracy_decimals: 2
    update_interval: 5s
    lambda: |-
      const auto &c = id(geometrie_camera_app_id).measurement_engine().calibration();
      return c.reference_height_px > 0 ? c.cy_px : NAN;

  - platform: template
    name: "94 Z estime largeur"
    unit_of_measurement: "mm"
    accuracy_decimals: 1
    update_interval: 1s
    lambda: |-
      const auto &m = id(geometrie_camera_app_id).last_measurement();
      return m.valid ? m.z_from_width_mm : NAN;

  - platform: template
    name: "95 Z estime hauteur"
    unit_of_measurement: "mm"
    accuracy_decimals: 1
    update_interval: 1s
    lambda: |-
      const auto &m = id(geometrie_camera_app_id).last_measurement();
      return m.valid ? m.z_from_height_mm : NAN;

  - platform: template
    name: "96 Pose Z homographie"
    unit_of_measurement: "mm"
    accuracy_decimals: 1
    update_interval: 1s
    lambda: |-
      const auto &m = id(geometrie_camera_app_id).last_measurement();
      return m.valid ? m.pose_z_mm : NAN;

  - platform: template
    name: "97 Erreur echelle pose"
    unit_of_measurement: "%"
    accuracy_decimals: 1
    update_interval: 1s
    lambda: |-
      const auto &m = id(geometrie_camera_app_id).last_measurement();
      return m.valid ? m.pose_scale_error_pct : NAN;

  - platform: template
    name: "98 Yaw cible"
    unit_of_measurement: "deg"
    accuracy_decimals: 4
    update_interval: 1s
    lambda: |-
      const auto &m = id(geometrie_camera_app_id).last_measurement();
      return m.valid && m.pose_valid ? m.yaw_deg : NAN;

  - platform: template
    name: "99 Pitch cible"
    unit_of_measurement: "deg"
    accuracy_decimals: 4
    update_interval: 1s
    lambda: |-
      const auto &m = id(geometrie_camera_app_id).last_measurement();
      return m.valid && m.pose_valid ? m.pitch_deg : NAN;

  - platform: template
    name: "100 Rotation cible"
    unit_of_measurement: "deg"
    accuracy_decimals: 4
    update_interval: 1s
    lambda: |-
      const auto &m = id(geometrie_camera_app_id).last_measurement();
      return m.valid && m.pose_valid ? m.roll_deg : NAN;
