# Capteur camera pour geometrie automobile - ESP32-S3 + OV3660
# Architecture inspiree de equilibreuse-esp32 :
# YAML = materiel / ESPHome
# C++  = logique applicative / traitement image / calculs

substitutions:
  device_name: geometrie-camera
  friendly_name: Geometrie Camera

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}

esp32:
  variant: esp32s3
  framework:
    type: esp-idf

# La camera haute resolution necessite la PSRAM.
psram:
  mode: octal
  speed: 80MHz

preferences:
  flash_write_interval: 5s

logger:
  level: DEBUG

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: NONE
  fast_connect: true

  ap:
    ssid: "Geometrie Camera Fallback"
    password: "geometrie"

captive_portal:

web_server:
  port: 80
  version: 3

ota:
  - platform: esphome
  - platform: web_server

# ============================================================
# APPLICATION C++
# ============================================================

external_components:
  - source: geometrie-camera/components

geometrie_camera_app:
  id: geometrie_camera_app_id

# ============================================================
# CAMERA OV3660
# ============================================================
#
# Le capteur recu est un OV3660 monte sur une carte ESP32-S3.
# Le brochage du bus camera (D0..D7, XCLK, PCLK, VSYNC, HREF, SCCB)
# depend du PCB exact et doit etre confirme avant activation.
#
# La section ci-dessous est volontairement laissee inactive pour eviter de
# commander une broche incorrecte lors du premier flash. Une fois le pinout
# du PCB confirme, elle sera activee sans changer l'architecture C++.
#
# esp32_camera:
#   id: camera_geometrie
#   name: "Camera geometrie"
#   external_clock:
#     pin: GPIOXX
#     frequency: 20MHz
#   i2c_pins:
#     sda: GPIOXX
#     scl: GPIOXX
#   data_pins:
#     - GPIOXX  # D0
#     - GPIOXX  # D1
#     - GPIOXX  # D2
#     - GPIOXX  # D3
#     - GPIOXX  # D4
#     - GPIOXX  # D5
#     - GPIOXX  # D6
#     - GPIOXX  # D7
#   vsync_pin: GPIOXX
#   href_pin: GPIOXX
#   pixel_clock_pin: GPIOXX
#   # power_down_pin: GPIOXX
#   # reset_pin: GPIOXX
#   resolution: 1600x1200
#   jpeg_quality: 10
#   max_framerate: 1 fps
#   idle_framerate: 0.1 fps
#
# Premier objectif : image fixe exploitable, pas de streaming temps reel.

# ============================================================
# PARAMETRES DE DEVELOPPEMENT / CALIBRATION
# ============================================================

number:
  - platform: template
    name: "Intervalle acquisition"
    id: intervalle_acquisition_ms
    min_value: 200
    max_value: 10000
    step: 100
    initial_value: 1000
    restore_value: true
    optimistic: true
    unit_of_measurement: "ms"

  - platform: template
    name: "Focale calibration X"
    id: focale_fx
    min_value: 100
    max_value: 10000
    step: 0.1
    initial_value: 1000
    restore_value: true
    optimistic: true
    unit_of_measurement: "px"

  - platform: template
    name: "Focale calibration Y"
    id: focale_fy
    min_value: 100
    max_value: 10000
    step: 0.1
    initial_value: 1000
    restore_value: true
    optimistic: true
    unit_of_measurement: "px"

  - platform: template
    name: "Centre optique X"
    id: centre_optique_cx
    min_value: 0
    max_value: 3000
    step: 0.1
    initial_value: 1024
    restore_value: true
    optimistic: true
    unit_of_measurement: "px"

  - platform: template
    name: "Centre optique Y"
    id: centre_optique_cy
    min_value: 0
    max_value: 2000
    step: 0.1
    initial_value: 768
    restore_value: true
    optimistic: true
    unit_of_measurement: "px"

# ============================================================
# ETAT V0
# ============================================================

text_sensor:
  - platform: template
    name: "Etat capteur geometrie"
    id: etat_capteur_geometrie
    update_interval: 5s
    lambda: |-
      return {id(geometrie_camera_app_id).status_text()};

sensor:
  - platform: template
    name: "Mesures valides"
    id: compteur_mesures_valides
    accuracy_decimals: 0
    update_interval: 5s
    lambda: |-
      return id(geometrie_camera_app_id).valid_measurement_count();

  - platform: template
    name: "Angle horizontal cible"
    id: angle_horizontal_cible
    unit_of_measurement: "deg"
    accuracy_decimals: 4
    update_interval: 1s
    lambda: |-
      return id(geometrie_camera_app_id).last_measurement().yaw_deg;

  - platform: template
    name: "Angle vertical cible"
    id: angle_vertical_cible
    unit_of_measurement: "deg"
    accuracy_decimals: 4
    update_interval: 1s
    lambda: |-
      return id(geometrie_camera_app_id).last_measurement().pitch_deg;

  - platform: template
    name: "Rotation cible"
    id: rotation_cible
    unit_of_measurement: "deg"
    accuracy_decimals: 4
    update_interval: 1s
    lambda: |-
      return id(geometrie_camera_app_id).last_measurement().roll_deg;
