# Capteur camera pour geometrie automobile - ESP32-S3 + OV3660
# Architecture inspiree de equilibreuse-esp32 :
# YAML = materiel / ESPHome
# C++  = logique applicative / traitement image / calculs

substitutions:
  device_name: geometrie-camera
  friendly_name: Geometrie Camera

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}

esp32:
  variant: esp32s3
  framework:
    type: esp-idf

# La camera haute resolution necessite la PSRAM.
# Carte GOOUUU ESP32-S3-CAM N16R8 : 8 Mo de PSRAM octal.
psram:
  mode: octal
  speed: 80MHz

preferences:
  flash_write_interval: 5s

logger:
  level: DEBUG

# API native ESPHome : permet notamment l'affichage des logs via le reseau.
api:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: NONE
  fast_connect: true

  ap:
    ssid: "Geometrie Camera Fallback"
    password: "geometrie"

captive_portal:

web_server:
  port: 80
  version: 3

ota:
  - platform: esphome
  - platform: web_server

# ============================================================
# APPLICATION C++
# ============================================================

external_components:
  - source: geometrie-camera/components

geometrie_camera_app:
  id: geometrie_camera_app_id

# ============================================================
# CAMERA OV3660 - GOOUUU ESP32-S3-CAM V1.5
# ============================================================
# Brochage confirme depuis le schema vendeur :
#   SIOD  = GPIO4
#   SIOC  = GPIO5
#   VSYNC = GPIO6
#   HREF  = GPIO7
#   XCLK  = GPIO15
#   Y2    = GPIO11
#   Y3    = GPIO9
#   Y4    = GPIO8
#   Y5    = GPIO10
#   Y6    = GPIO12
#   Y7    = GPIO18
#   Y8    = GPIO17
#   Y9    = GPIO16
#   PCLK  = GPIO13
#
# Pour la premiere validation on reste volontairement en 640x480.
# L'objectif est uniquement de confirmer l'initialisation et une capture JPEG.

i2c:
  - id: camera_i2c
    sda: GPIO4
    scl: GPIO5
    scan: true

esp32_camera:
  id: camera_geometrie
  name: "Camera geometrie"

  external_clock:
    pin: GPIO15
    frequency: 20MHz

  i2c_id: camera_i2c

  data_pins:
    - GPIO11  # Y2 / D0
    - GPIO9   # Y3 / D1
    - GPIO8   # Y4 / D2
    - GPIO10  # Y5 / D3
    - GPIO12  # Y6 / D4
    - GPIO18  # Y7 / D5
    - GPIO17  # Y8 / D6
    - GPIO16  # Y9 / D7

  vsync_pin: GPIO6
  href_pin: GPIO7
  pixel_clock_pin: GPIO13

  pixel_format: JPEG
  resolution: 640x480
  jpeg_quality: 10
  frame_buffer_count: 1
  frame_buffer_location: PSRAM
  max_framerate: 1 fps
  idle_framerate: 0.1 fps

# Serveur temporaire de validation de la camera reelle.
# Une requete HTTP sur http://<IP>:8081/ declenche et retourne un snapshot JPEG.
# Il sera retire lorsque Ov3660ImageProvider sera relie a notre API /api/capture.
esp32_camera_web_server:
  - port: 8081
    mode: snapshot

# ============================================================
# PARAMETRES DE DEVELOPPEMENT / CALIBRATION
# ============================================================

number:
  - platform: template
    name: "Intervalle acquisition"
    id: intervalle_acquisition_ms
    min_value: 200
    max_value: 10000
    step: 100
    initial_value: 1000
    restore_value: true
    optimistic: true
    unit_of_measurement: "ms"

  - platform: template
    name: "Focale calibration X"
    id: focale_fx
    min_value: 100
    max_value: 10000
    step: 0.1
    initial_value: 1000
    restore_value: true
    optimistic: true
    unit_of_measurement: "px"

  - platform: template
    name: "Focale calibration Y"
    id: focale_fy
    min_value: 100
    max_value: 10000
    step: 0.1
    initial_value: 1000
    restore_value: true
    optimistic: true
    unit_of_measurement: "px"

  - platform: template
    name: "Centre optique X"
    id: centre_optique_cx
    min_value: 0
    max_value: 3000
    step: 0.1
    initial_value: 1024
    restore_value: true
    optimistic: true
    unit_of_measurement: "px"

  - platform: template
    name: "Centre optique Y"
    id: centre_optique_cy
    min_value: 0
    max_value: 2000
    step: 0.1
    initial_value: 768
    restore_value: true
    optimistic: true
    unit_of_measurement: "px"

# ============================================================
# ETAT V0
# ============================================================

text_sensor:
  - platform: template
    name: "Etat capteur geometrie"
    id: etat_capteur_geometrie
    update_interval: 5s
    lambda: |-
      return {id(geometrie_camera_app_id).status_text()};

sensor:
  - platform: template
    name: "Mesures valides"
    id: compteur_mesures_valides
    accuracy_decimals: 0
    update_interval: 5s
    lambda: |-
      return id(geometrie_camera_app_id).valid_measurement_count();

  - platform: template
    name: "Angle horizontal cible"
    id: angle_horizontal_cible
    unit_of_measurement: "deg"
    accuracy_decimals: 4
    update_interval: 1s
    lambda: |-
      return id(geometrie_camera_app_id).last_measurement().yaw_deg;

  - platform: template
    name: "Angle vertical cible"
    id: angle_vertical_cible
    unit_of_measurement: "deg"
    accuracy_decimals: 4
    update_interval: 1s
    lambda: |-
      return id(geometrie_camera_app_id).last_measurement().pitch_deg;

  - platform: template
    name: "Rotation cible"
    id: rotation_cible
    unit_of_measurement: "deg"
    accuracy_decimals: 4
    update_interval: 1s
    lambda: |-
      return id(geometrie_camera_app_id).last_measurement().roll_deg;
